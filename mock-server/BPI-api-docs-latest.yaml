                items:
                  type: object
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    post:
      tags:
      - TMF639 Resource Typed Controller
      description: Creates a resource
      operationId: createResource
      parameters:
      - name: resourceType
        in: path
        description: Resource Type
        required: true
        schema:
