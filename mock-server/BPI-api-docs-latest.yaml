openapi: 3.0.1
info:
  title: TMF API
servers:
- url: /blueplanet-inventory-tmf-api
security:
- bearer-jwt:
  - read
  - write
tags:
- name: Lumen Custom Logical Route API Controller
  description: APIs for generating logical routes for Lumen resources
paths:
  /bpmn/workflow/definitions/suspend:
    put:
      tags:
      - BPMN
      - Workflow
      - Bpmn workflow definition operations
      description: Suspends given workflow definitions
      operationId: suspendDefinitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionSuspendActivateRequest"
        required: true
      responses:
        "204":
          description: Success
          content:
            application/json: {}
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
  /bpmn/workflow/definitions/activate:
    put:
      tags:
      - BPMN
      - Workflow
      - Bpmn workflow definition operations
      description: Activates given workflow definitions
      operationId: activateDefinitions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionSuspendActivateRequest"
        required: true
      responses:
        "204":
          description: Success
          content:
            application/json: {}
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
  /v1/service:
    get:
      tags:
      - TMF638 Service Controller
      summary: lists all services based on query parameters
      operationId: getServices
      parameters:
      - name: name
        in: query
        description: "Service Name(Eg: ~'L3VPN.*')"
      - name: offset
        in: query
        description: Service offset
      - name: limit
        in: query
        description: Limit
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefaultServiceResponse"
        "206":
          description: Partial Content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefaultServiceResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    post:
      tags:
      - TMF638 Service Controller
      summary: creates a service
      operationId: createService
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Service Creation Request"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultServiceResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    delete:
      tags:
      - TMF638 Service Controller
      operationId: deleteServices
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
  /v1/service/async:
    get:
      tags:
      - TMF638 Service Controller
      summary: lists all services based on query parameters asynchronously
      operationId: getServicesAsync
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    post:
      tags:
      - TMF638 Service Controller
      summary: creates a service asynchronously
      operationId: createServiceAsync
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Service Creation Request"
        required: true
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
