          format: date-time
        startMode:
          type: string
        endDate:
          type: string
          format: date-time
        serviceSpecification:
          $ref: "#/components/schemas/ServiceSpecification"
        place:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        serviceDate:
          type: string
          format: date-time
        '@baseType':
          type: string
        '@type':
          type: string
        '@schemaLocation':
          type: string
    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        schemaLocation:
          type: string
        baseType:
          type: string
        externalId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        description:
          type: string
        category:
          type: string
        characteristics:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        relatedParties:
