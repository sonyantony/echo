    LogicalConnection:
      type: object
      properties:
        connectionType:
          type: string
          description: PRO connection or hop type. Observed values include LX and
            LC. This is intentionally modelled as an open string rather than a strict
            enum because additional values may exist.
          example: LX
        portA:
          $ref: "#/components/schemas/LogicalPort"
        portZ:
          $ref: "#/components/schemas/LogicalPort"
        warning:
          type: string
          description: Warning associated with the hop. Empty in many happy-path examples.
        error:
          type: string
          description: Error or marker text associated with this connection entry.
            PROTECT SEGMENTS markers are preserved in the connection list to align
            with PRO behaviour.
          example: "2UPSR/SNCP PROTECT SEGMENTS:"
      description: "A hop between two logical or physical port representations. This\
        \ is the JSON equivalent of a PRO connections element. Some connection entries\
        \ may be marker/error entries and therefore may not contain connectionType,\
        \ portA, or portZ."
    LogicalPort:
      type: object
      properties:
        absoluteChannelBandwidth:
          type: string
          description: Absolute channel bandwidth where supplied by PRO.
          example: 100GIG
        absoluteChannelName:
          type: string
          description: Absolute channel name where supplied by PRO.
          example: WAVELENGTH-9170
        absoluteChannelNumber:
          type: integer
          description: Absolute channel number. Observed as 0 in many samples.
          format: int32
          example: 0
        absolutePath:
          type: string
          description: Full path context for the logical AID.
          example: 57302G/OTU4/EWNCWADT/BRWSWAEI
        channelBandwidth:
          type: string
          description: Bandwidth of the represented channel.
          example: 100GIG
        channelName:
          type: string
          description: Channel label or wavelength label.
          example: WAVELENGTH-9170
        channelNumber:
          type: integer
          description: Numeric channel identifier.
          format: int32
          example: 9170
        equipmentFqn:
          type: string
          description: Fully qualified equipment name.
          example: BRWSWAEI.ALU.1830PSS.00001
        globalId:
          type: integer
          description: PRO global equipment identifier where supplied.
          format: int64
          example: 51083
        legacyContainerName:
          type: string
          description: Legacy container name where supplied by PRO.
          example: AID-LEGACY-CONTAINER
        logicalAid:
          type: string
          description: Generated logical AID. May be empty for marker rows or unresolved
            logicals.
          example: S13X100-1-16-L1
        managementNeName:
          type: string
          description: Management network element name where supplied by PRO.
          example: BRWSWAEIAR51083
        neCategory:
          type: string
          description: Network element category.
          example: TRANSPORT
        pathId:
          type: integer
          description: PRO path identifier. Observed as 0 in sample XML.
          format: int64
          example: 0
        physicalAid:
          type: string
          description: Physical AID of the underlying port. May be empty for marker
            rows.
          example: S13X100-1-16-L1-OUT
        portBandwidth:
          type: string
          description: Bandwidth or signal type of the port. Modelled as an open string.
          example: OTU4
        relativePath:
          type: string
          description: Relative path context for the logical port.
          example: 57302G/OTU4/EWNCWADT/BRWSWAEI
        relativePathBandwidth:
          type: string
          description: Bandwidth of the relative path.
          example: 100GIG
        siteName:
          type: string
          description: Site or location name.
          example: BRWSWAEI-BREWSTER
        tid:
          type: string
          description: Network TID.
          example: BRWSWAEIAR51083
        warning:
          type: string
          description: Warning associated with this logical port or logical AID generation.
            PRO-style marker text may also be represented here.
        error:
          type: string
          description: Error or marker text associated with this route row. PROTECT
            SEGMENTS markers are preserved as rows in ports to align with PRO.
          example: "2UPSR/SNCP PROTECT SEGMENTS:"
      description: "Reusable port schema used in connection endpoints and in the ordered\
        \ ports list. This represents the JSON equivalent of PRO portA, portZ, and\
        \ ports elements."
    LogicalRouteResponse:
      type: object
      properties:
        segments:
          type: array
          description: Ordered logical route segments. Each segment corresponds to
            a logical route grouping returned for the connection. This maps to repeated
            logicalLeg elements in the equivalent PRO XML response. May be empty.
          items:
            $ref: "#/components/schemas/LogicalRouteSegment"
      description: JSON response containing the logical route as BPI route segments.
        The segments array may be empty to represent a successful request where no
        route segments are returned.
    LogicalRouteSegment:
      type: object
      properties:
        segmentName:
          type: string
          description: Logical route segment name.
          example: LOGICAL/1
        segmentRole:
          $ref: "#/components/schemas/SegmentRole"
        warningMessage:
          type: string
          description: Segment-level warning message aligned to the route segment
            output. This corresponds to the PRO warningMessage element and is kept
            separate from port-level and connection-level warning values.
          example: CHILD_PATH_COMMIT_DATE_NULL_WARNING
        connections:
          type: array
          description: "Repeating connection or hop objects, equivalent to repeated\
            \ PRO connections elements. Some entries may be marker/error records rather\
            \ than normal A/Z connection hops."
          items:
            $ref: "#/components/schemas/LogicalConnection"
        ports:
          type: array
          description: "Ordered list of displayed logical route ports for this segment,\
            \ equivalent to repeated PRO ports elements. Marker rows such as PROTECT\
            \ SEGMENTS are preserved in this list to align with PRO behaviour."
          items:
            $ref: "#/components/schemas/LogicalPort"
      description: "A BPI logical route segment. Each segment is an ordered grouping\
        \ of route hops and displayed logical route ports associated with the requested\
        \ connection. Examples include LOGICAL/1, LOGICAL/9, LOGICAL/GIG-E-01, and\
        \ LOGICAL/STS1-1. The same segmentName may appear more than once, so it should\
        \ not be treated as a globally unique identifier without additional context.\
        \ Consumers must preserve the returned order."
    SegmentRole:
      type: string
      description: Classification of the logical route segment. Consumed represents
        the route or underlying logicals consumed by the requested connection. Provided
        represents logical services or channels provided by the requested connection.
      enum:
      - consumed
      - provided
