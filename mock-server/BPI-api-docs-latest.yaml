components:
  schemas:
    WorkflowDefinitionSuspendActivateRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        includeProcessInstances:
          type: boolean
    Characteristic:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        value:
          type: object
        valueType:
          type: string
        '@schemaLocation':
          type: string
    Note:
      type: object
      properties:
        author:
          type: string
        date:
          type: string
          format: date-time
        text:
          type: string
    Place:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        href:
          type: string
    RelatedParty:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        href:
          type: string
        '@type':
          type: string
        '@referredType':
          type: string
    RelatedService:
      type: object
      properties:
        href:
          type: string
        id:
          type: string
        name:
          type: string
        state:
          type: string
        serviceCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        '@type':
          type: string
    Service Creation Request:
      required:
      - '@type'
      type: object
      properties:
        state:
          type: string
          enum:
          - initial
          - feasibilityChecked
          - designed
          - reserving
          - reserved
          - reservingFailed
          - inactive
          - activating
          - active
          - failed
          - terminated
          - unknown
          - Cancelled
        serviceCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        note:
          type: array
          writeOnly: true
          items:
            $ref: "#/components/schemas/Note"
        name:
          type: string
          writeOnly: true
        category:
          type: string
          writeOnly: true
        serviceOrder:
          type: array
          writeOnly: true
          items:
            $ref: "#/components/schemas/ServiceOrder"
        relatedParty:
          type: array
          writeOnly: true
          items:
            $ref: "#/components/schemas/RelatedParty"
        isServiceEnabled:
          type: boolean
          writeOnly: true
        serviceType:
          type: string
          writeOnly: true
        serviceRelationship:
          type: array
          writeOnly: true
          items:
            $ref: "#/components/schemas/ServiceRelationship"
        serviceSpecification:
          $ref: "#/components/schemas/ServiceSpecification"
        isStateful:
          type: boolean
          writeOnly: true
        hasStarted:
          type: boolean
          writeOnly: true
        place:
          type: array
          writeOnly: true
          items:
            $ref: "#/components/schemas/Place"
        '@baseType':
          type: string
        '@type':
          type: string
        '@schemaLocation':
          type: string
      description: Data required for Service creation
    ServiceOrder:
      type: object
      properties:
        id:
          type: string
        serviceOrderItemId:
          type: string
        href:
          type: string
        '@referredType':
          type: string
    ServiceRelationship:
      type: object
      properties:
        relationshipType:
          type: string
        service:
          $ref: "#/components/schemas/RelatedService"
    ServiceSpecification:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        href:
          type: string
        version:
          type: string
        '@type':
          type: string
    DefaultServiceResponse:
      type: object
      properties:
        service:
          $ref: "#/components/schemas/Service"
        urlUtils:
          $ref: "#/components/schemas/URLUtils"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        name:
          type: string
        id:
          type: string
        state:
          type: string
          enum:
          - initial
          - feasibilityChecked
          - designed
          - reserving
          - reserved
          - reservingFailed
          - inactive
          - activating
          - active
          - failed
          - terminated
          - unknown
          - Cancelled
        category:
          type: string
        serviceOrder:
          type: array
          items:
            $ref: "#/components/schemas/ServiceOrder"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
        supportingService:
          type: array
          items:
            $ref: "#/components/schemas/SupportingItem"
        supportingResource:
          type: array
          items:
            $ref: "#/components/schemas/SupportingResource"
        operatingState:
          type: string
        href:
          type: string
        serviceType:
          type: string
        serviceCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        serviceRelationship:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRelationship"
        isStateful:
          type: boolean
        isServiceEnabled:
          type: boolean
        hasStarted:
          type: boolean
        startDate:
