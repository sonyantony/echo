          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
    post:
      tags:
      - TMF639 Resource Untyped Controller
      operationId: createResource_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultResourceCreateRequest"
        required: true
      responses:
        "200":
