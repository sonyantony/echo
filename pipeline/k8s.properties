# Kubernetes manifests that build-flow.sh writes next to each image, in build/<app>/k8s/:
# deployment.yaml, service.yaml and ingress.yaml (or httproute.yaml). The Ingress lists only the
# paths the flows serve, so other apps on the same host keep the paths they serve. Edit these for
# your cluster; leave a setting empty to leave it out. Applying the files is up to your pipeline
# (the sample Jenkinsfile has an optional DEPLOY stage) or your GitOps tool.

# Write the manifests at all (true | false).
k8s.enabled=true

# How requests reach the flows: ingress (networking.k8s.io/v1 Ingress), httproute (Gateway API
# HTTPRoute, needs k8s.gateway) or none (Deployment and Service only).
k8s.routing=ingress

# Namespace of every object; empty means the one kubectl applies to.
k8s.namespace=

# Host name the flows answer on, e.g. api.example.com; empty matches any host.
k8s.host=

# Ingress class, e.g. nginx, traefik, alb; empty uses the cluster's default class.
k8s.ingress-class=

# Secret with the TLS certificate for k8s.host; empty means no TLS section.
k8s.tls-secret=

# Gateway the HTTPRoute attaches to: <name> or <namespace>/<name> (k8s.routing=httproute only).
k8s.gateway=

# Pods per app.
k8s.replicas=1

# Ingress annotations for your controller: k8s.annotation.<key>=<value>, for example
# k8s.annotation.nginx.ingress.kubernetes.io/proxy-body-size=10m
