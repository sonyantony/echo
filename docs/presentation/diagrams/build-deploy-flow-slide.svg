<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 150 1540 740" width="1540" height="740" role="img" aria-labelledby="dt">
<title id="dt">ECHO build and deploy flow</title>
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
.s{font-family:'IBM Plex Sans',Arial,sans-serif}
.m{font-family:'IBM Plex Mono',Consolas,monospace}
.w{fill:#FFFFFF}.mu{fill:#C4C4CD}.y{fill:#FFE600}.d{fill:#2E2E38}
.eb{font-size:12px;letter-spacing:1.6px}
.t{font-size:22px;font-weight:600}
.sub{font-size:14px}
.lbl{font-size:13px}
</style>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C4C4CD"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFE600"/></marker>
</defs>
<rect width="1600" height="900" fill="#2E2E38"/>

<!-- 1 user at computer -->
<line x1="48" y1="276" x2="244" y2="276" stroke="#747480" stroke-width="2"/>
<circle cx="80" cy="214" r="13" fill="#C4C4CD"/>
<path d="M54 274 Q54 238 80 236 Q106 238 106 274 Z" fill="#C4C4CD"/>
<rect x="120" y="178" width="114" height="76" rx="4" fill="#3A3A46" stroke="#C4C4CD" stroke-width="2"/>
<rect x="134" y="196" width="18" height="12" rx="2" fill="#FFE600"/>
<rect x="168" y="214" width="18" height="12" rx="2" fill="#C4C4CD"/>
<rect x="202" y="232" width="18" height="12" rx="2" fill="#C4C4CD"/>
<path d="M152 202 H160 V220 H168 M186 220 H194 V238 H202" fill="none" stroke="#C4C4CD" stroke-width="1.5"/>
<rect x="169" y="254" width="16" height="14" fill="#747480"/>
<rect x="153" y="268" width="48" height="5" fill="#747480"/>
<text x="60" y="304" class="s w sub" font-weight="600">Flow designer</text>
<text x="60" y="324" class="s mu lbl">at their own computer</text>

<!-- arrow user -> builder -->
<line x1="246" y1="226" x2="296" y2="226" stroke="#C4C4CD" stroke-width="2" marker-end="url(#ag)"/>
<text x="271" y="214" class="m mu" font-size="11" text-anchor="middle">HTTPS</text>

<!-- 2 builder -->
<rect x="300" y="170" width="260" height="130" rx="6" fill="#3A3A46" stroke="#747480"/>
<text x="324" y="200" class="m eb mu">ECHO BUILDER</text>
<text x="324" y="232" class="s w t">Builder backend</text>
<text x="324" y="258" class="s mu sub">Spring Boot · React UI</text>
<text x="324" y="280" class="s mu sub">designs, runs and validates flows</text>

<!-- arrow builder -> git -->
<line x1="560" y1="235" x2="656" y2="235" stroke="#C4C4CD" stroke-width="2" marker-end="url(#ag)"/>
<text x="608" y="223" class="s w lbl" font-weight="600" text-anchor="middle">Publish</text>
<text x="608" y="254" class="m mu" font-size="11" text-anchor="middle">git push</text>

<!-- 3 git -->
<rect x="660" y="170" width="240" height="130" rx="6" fill="none" stroke="#C4C4CD" stroke-width="1.5"/>
<text x="684" y="200" class="m eb mu">GIT</text>
<text x="684" y="232" class="s w t">Flows repository</text>
<text x="684" y="258" class="m mu" font-size="13">flows/&lt;flow&gt;/</text>
<text x="684" y="280" class="s mu sub">one folder per flow</text>

<!-- arrow git -> pipeline -->
<line x1="900" y1="235" x2="996" y2="235" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="948" y="223" class="s y lbl" font-weight="600" text-anchor="middle">picks up</text>
<text x="948" y="254" class="m mu" font-size="11" text-anchor="middle">new commit</text>

<!-- 4 pipeline build -->
<rect x="1000" y="170" width="260" height="130" rx="6" fill="#FFE600"/>
<text x="1024" y="200" class="m eb d">PIPELINE · JENKINS</text>
<text x="1024" y="232" class="s d t">Build image</text>
<text x="1024" y="258" class="s d sub">Camel export → Spring Boot jar</text>
<text x="1024" y="280" class="s d sub">→ Docker image + k8s manifests</text>

<!-- arrow pipeline -> jfrog -->
<line x1="1260" y1="235" x2="1336" y2="235" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="1298" y="223" class="s y lbl" font-weight="600" text-anchor="middle">push</text>

<!-- 5 jfrog -->
<rect x="1340" y="170" width="220" height="130" rx="6" fill="none" stroke="#C4C4CD" stroke-width="1.5"/>
<text x="1362" y="200" class="m eb mu">IMAGE REGISTRY</text>
<text x="1362" y="232" class="s w t">JFrog Artifactory</text>
<text x="1362" y="258" class="m mu" font-size="13">echo-flows:1.0.42</text>
<text x="1362" y="280" class="s mu sub">one image, every stage</text>

<!-- pull bus -->
<path d="M1450 300 V400 H460" fill="none" stroke="#FFE600" stroke-width="2.5"/>
<line x1="460" y1="400" x2="460" y2="456" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<line x1="880" y1="400" x2="880" y2="456" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<line x1="1300" y1="400" x2="1300" y2="456" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="1090" y="388" class="s y lbl" font-weight="600" text-anchor="middle">pipeline pulls the image for each deploy</text>
<text x="472" y="436" class="m mu" font-size="11">pull</text>
<text x="892" y="436" class="m mu" font-size="11">pull</text>
<text x="1312" y="436" class="m mu" font-size="11">pull</text>

<!-- legend -->
<text x="60" y="478" class="m eb mu">KEY</text>
<rect x="60" y="496" width="22" height="16" rx="3" fill="#FFE600"/>
<text x="94" y="509" class="s w lbl">Pipeline step</text>
<rect x="60" y="528" width="22" height="16" rx="3" fill="none" stroke="#C4C4CD" stroke-width="1.5"/>
<text x="94" y="541" class="s w lbl">Repository or registry</text>
<rect x="60" y="560" width="22" height="16" rx="3" fill="#3A3A46" stroke="#747480"/>
<text x="94" y="573" class="s w lbl">Application or environment</text>
<line x1="60" y1="600" x2="82" y2="600" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="94" y="605" class="s w lbl">Pipeline moves it</text>

<!-- environments -->
<g>
<rect x="300" y="460" width="320" height="180" rx="6" fill="#3A3A46" stroke="#747480"/>
<path d="M306 460 H614 A6 6 0 0 1 620 466 V500 H300 V466 A6 6 0 0 1 306 460 Z" fill="#FFE600"/>
<text x="320" y="486" class="s d" font-size="15" font-weight="600">Deploy stage</text>
<text x="600" y="486" class="m d" font-size="12" text-anchor="end">1</text>
<text x="320" y="546" class="s w" font-size="30" font-weight="600">dev1</text>
<text x="320" y="574" class="s mu sub">Kubernetes · namespace dev1</text>
<text x="320" y="602" class="m mu" font-size="12">kubectl apply</text>
<text x="320" y="622" class="m mu" font-size="12">Deployment · Service · Ingress</text>
</g>
<g>
<rect x="720" y="460" width="320" height="180" rx="6" fill="#3A3A46" stroke="#747480"/>
<path d="M726 460 H1034 A6 6 0 0 1 1040 466 V500 H720 V466 A6 6 0 0 1 726 460 Z" fill="#FFE600"/>
<text x="740" y="486" class="s d" font-size="15" font-weight="600">Deploy stage</text>
<text x="1020" y="486" class="m d" font-size="12" text-anchor="end">2</text>
<text x="740" y="546" class="s w" font-size="30" font-weight="600">test4</text>
<text x="740" y="574" class="s mu sub">Kubernetes · namespace test4</text>
<text x="740" y="602" class="m mu" font-size="12">kubectl apply</text>
<text x="740" y="622" class="m mu" font-size="12">Deployment · Service · Ingress</text>
</g>
<g>
<rect x="1140" y="460" width="320" height="180" rx="6" fill="#3A3A46" stroke="#FFE600" stroke-width="2"/>
<path d="M1146 460 H1454 A6 6 0 0 1 1460 466 V500 H1140 V466 A6 6 0 0 1 1146 460 Z" fill="#FFE600"/>
<text x="1160" y="486" class="s d" font-size="15" font-weight="600">Deploy stage</text>
<text x="1440" y="486" class="m d" font-size="12" text-anchor="end">3</text>
<text x="1160" y="546" class="s w" font-size="30" font-weight="600">production</text>
<text x="1160" y="574" class="s mu sub">Kubernetes · namespace production</text>
<text x="1160" y="602" class="m mu" font-size="12">kubectl apply</text>
<text x="1160" y="622" class="m mu" font-size="12">Deployment · Service · Ingress</text>
</g>

<!-- promote arrows -->
<line x1="620" y1="556" x2="716" y2="556" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="668" y="544" class="s y lbl" font-weight="600" text-anchor="middle">promote</text>
<line x1="1040" y1="556" x2="1136" y2="556" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="1088" y="544" class="s y lbl" font-weight="600" text-anchor="middle">promote</text>

<!-- config repo -->
<rect x="60" y="720" width="1400" height="110" rx="6" fill="none" stroke="#C4C4CD" stroke-width="1.5"/>
<text x="84" y="752" class="m eb mu">CONFIGURATION REPOSITORY</text>
<text x="84" y="784" class="s w t">Settings and secrets</text>
<text x="84" y="808" class="s mu sub">one folder per environment</text>

<rect x="360" y="745" width="200" height="62" rx="4" fill="#3A3A46" stroke="#747480"/>
<text x="378" y="771" class="m w" font-size="15">dev1/</text>
<text x="378" y="793" class="s mu lbl">config values + secrets</text>
<rect x="780" y="745" width="200" height="62" rx="4" fill="#3A3A46" stroke="#747480"/>
<text x="798" y="771" class="m w" font-size="15">test4/</text>
<text x="798" y="793" class="s mu lbl">config values + secrets</text>
<rect x="1200" y="745" width="200" height="62" rx="4" fill="#3A3A46" stroke="#747480"/>
<text x="1218" y="771" class="m w" font-size="15">production/</text>
<text x="1218" y="793" class="s mu lbl">config values + secrets</text>

<line x1="460" y1="745" x2="460" y2="644" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<line x1="880" y1="745" x2="880" y2="644" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<line x1="1300" y1="745" x2="1300" y2="644" stroke="#FFE600" stroke-width="2.5" marker-end="url(#ay)"/>
<text x="472" y="690" class="s y lbl" font-weight="600">pipeline pulls</text>
<text x="472" y="707" class="m mu" font-size="11">ConfigMap + Secret</text>
<text x="892" y="690" class="s y lbl" font-weight="600">pipeline pulls</text>
<text x="892" y="707" class="m mu" font-size="11">ConfigMap + Secret</text>
<text x="1312" y="690" class="s y lbl" font-weight="600">pipeline pulls</text>
<text x="1312" y="707" class="m mu" font-size="11">ConfigMap + Secret</text>

<!-- footnote -->
<text x="60" y="868" class="s mu lbl">The image holds no environment values. Each deploy stage reads that environment's settings and secrets from the configuration repository, so one image moves from dev1 to test4 to production unchanged.</text>
</svg>
