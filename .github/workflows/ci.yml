name: CI

on:
  push:
    branches: [Version1, Version2, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: builder-backend
        run: mvn -B verify

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: builder-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: builder-ui/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package the Builder (backend jar serving the built UI)
        working-directory: builder-backend
        run: mvn -B -q -Pwith-ui package -DskipTests
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the packaged Builder
        run: pnpm e2e
        env:
          ECHO_E2E_BUNDLED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: builder-ui/playwright-report
          retention-days: 7

  pipeline-modes:
    # Builds the sample flows into images with the sample pipeline script, in both build modes, and
    # checks they answer: bundle (all samples/flows in one image) and per-flow (one image per flow).
    name: pipeline (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [bundle, per-flow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the sample flow images (${{ matrix.mode }})
        run: pipeline/build-flow.sh samples/flows --mode ${{ matrix.mode }} --local-image
      - name: Smoke test the image
        run: pipeline/smoke-test-orders.sh ${{ matrix.mode == 'bundle' && '--bundle' || '' }}
      - name: Kubernetes manifests route only the flows' paths
        run: |
          if [ "${{ matrix.mode }}" = bundle ]; then
            k8s=build/echo-flows/k8s
            grep -q "image: 'echo-flows:1.0.0'" "$k8s/deployment.yaml"
            grep -A1 "path: '/api-docs'" "$k8s/ingress.yaml" | grep -q 'pathType: Prefix'
          else
            k8s=build/greetings/k8s
            grep -q "image: 'echo-flow-greetings:1.0.0'" "$k8s/deployment.yaml"
            k8s="$k8s build/orders/k8s"
          fi
          for dir in $k8s; do test -f "$dir/service.yaml"; done
          cat build/*/k8s/ingress.yaml
          # /greetings has GET /{name}: a prefix; orders is one platform-http path: exact.
          grep -h -A1 "path: '/greetings'" build/*/k8s/ingress.yaml | grep -q 'pathType: Prefix'
          grep -h -A1 "path: '/orders'" build/*/k8s/ingress.yaml | grep -q 'pathType: Exact'
          python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" build/*/k8s/*.yaml
      - name: Kubernetes routes follow the spec's paths, and can be a Gateway API HTTPRoute
        if: matrix.mode == 'per-flow'
        run: |
          shop="$(mktemp -d)"
          cp -r samples/flows/greetings "$shop/shop"
          mv "$shop/shop/greetings.camel.yaml" "$shop/shop/shop.camel.yaml"
          sed -i "s/echo-docs-greetings/echo-docs-shop/; s#/greetings/docs#/shop/docs#g" "$shop/shop/shop.camel.yaml"
          printf 'openapi: 3.0.3\ninfo: {title: Shop, version: 1.0.0}\nservers:\n  - url: https://api.example.com/shop\npaths:\n  /shoes: {get: {responses: {"200": {description: ok}}}}\n  /orders/{id}/items: {get: {responses: {"200": {description: ok}}}}\n' > "$shop/shop/greetings-api.yaml"
          printf 'k8s.routing=httproute\nk8s.gateway=infra/public\nk8s.host=api.example.com\n' > "$shop/k8s.properties"
          pipeline/build-flow.sh "$shop/shop" --mode per-flow --manifests-only --k8s-config "$shop/k8s.properties" --out "$shop/build"
          route="$shop/build/shop/k8s/httproute.yaml"
          cat "$route"
          test ! -f "$shop/build/shop/k8s/ingress.yaml"
          grep -B1 "value: '/shop/shoes'" "$route" | grep -q 'type: Exact'
          grep -B1 "value: '/shop/orders'" "$route" | grep -q 'type: PathPrefix'
          grep -B1 "value: '/shop/docs'" "$route" | grep -q 'type: PathPrefix'
          grep -q "namespace: 'infra'" "$route"
          test "$(grep -c 'value:' "$route")" = 3
      - name: A bundle with two flows on one Base Path fails clearly
        if: matrix.mode == 'bundle'
        run: |
          clash="$(mktemp -d)"
          cp -r samples/flows/greetings "$clash/greetings"
          cp -r samples/flows/greetings "$clash/hello"
          mv "$clash/hello/greetings.camel.yaml" "$clash/hello/hello.camel.yaml"
          if pipeline/build-flow.sh "$clash" --jar-only --out "$clash/build" 2> "$clash/err.txt"; then
            echo "The bundle build should have failed"; exit 1
          fi
          cat "$clash/err.txt"
          grep -q 'Base Path or path /greetings is used by more than one flow: greetings, hello' "$clash/err.txt"
      - name: The combined API docs page lists flows A to Z ignoring case, and keeps /api-docs
        if: matrix.mode == 'bundle'
        run: |
          docs="$(mktemp -d)"
          for n in Zebra apple Mango; do
            mkdir "$docs/$n"
            printf -- "- route:\n    id: 'echo-docs-%s-spec'\n    from:\n      uri: 'platform-http:/%s/docs/openapi'\n" "$n" "$n" > "$docs/$n/$n.camel.yaml"
          done
          jar="$(ls build/.yaml/BOOT-INF/lib/snakeyaml-*.jar)"
          java -cp "$jar" pipeline/ApiDocsPage.java "$docs/page.camel.yaml" "$docs/Zebra" "$docs/apple" "$docs/Mango"
          grep -q "urls: \[{url: ''apple/docs/openapi'', name: ''apple''}, {url: ''Mango/docs/openapi'', name: ''Mango''}, {url: ''Zebra/docs/openapi'', name: ''Zebra''}\]" "$docs/page.camel.yaml"
          clash="$(mktemp -d)"
          cp -r samples/flows/greetings "$clash/greetings"
          sed -i 's#url: /greetings#url: /api-docs/v1#' "$clash/greetings/greetings-api.yaml"
          if pipeline/build-flow.sh "$clash" --jar-only --out "$clash/build" 2> "$clash/err.txt"; then
            echo "The bundle build should have failed"; exit 1
          fi
          cat "$clash/err.txt"
          grep -q "/api-docs is the bundle's combined API docs page" "$clash/err.txt"
      - name: A disabled flow is left out of the bundle
        if: matrix.mode == 'bundle'
        run: |
          off="$(mktemp -d)"
          cp -r samples/flows/greetings "$off/greetings"
          cp -r samples/flows/greetings "$off/hello"
          mv "$off/hello/greetings.camel.yaml" "$off/hello/hello.camel.yaml"
          printf '{\n  "name" : "hello",\n  "disabled" : true\n}\n' > "$off/hello/echo-flow.json"
          pipeline/build-flow.sh "$off" --jar-only --out "$off/build" 2> "$off/err.txt" || { cat "$off/err.txt"; exit 1; }
          cat "$off/err.txt"
          grep -q 'hello: the flow is disabled' "$off/err.txt"

  pipeline:
    # The check branch protection requires: passes only when both build modes passed.
    needs: pipeline-modes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.pipeline-modes.result }}" = success

  image:
    # Builds the Builder's own Docker image and checks it starts healthy and serves the UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Builder image
        run: docker build -t echo-builder:ci .
      - name: Start it and check health and the UI
        run: |
          docker run -d --name echo-builder -p 8080:8080 echo-builder:ci
          for i in $(seq 1 60); do curl -fsS localhost:8080/actuator/health && break; sleep 2; done
          curl -fsS localhost:8080/login | grep -q '<div id="root">'
      - if: failure()
        run: docker logs echo-builder || true
