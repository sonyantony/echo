name: CI

on:
  push:
    branches: [Version1, Version2, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: builder-backend
        run: mvn -B verify

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: builder-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: builder-ui/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package the Builder (backend jar serving the built UI)
        working-directory: builder-backend
        run: mvn -B -q -Pwith-ui package -DskipTests
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests against the packaged Builder
        run: pnpm e2e
        env:
          ECHO_E2E_BUNDLED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: builder-ui/playwright-report
          retention-days: 7

  pipeline:
    # Builds the golden orders flow into an image with the sample pipeline script and checks it answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the orders flow image
        run: pipeline/build-flow.sh samples/flows/orders --local-image
      - name: Smoke test the image
        run: pipeline/smoke-test-orders.sh

  image:
    # Builds the Builder's own Docker image and checks it starts healthy and serves the UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Builder image
        run: docker build -t echo-builder:ci .
      - name: Start it and check health and the UI
        run: |
          docker run -d --name echo-builder -p 8080:8080 echo-builder:ci
          for i in $(seq 1 60); do curl -fsS localhost:8080/actuator/health && break; sleep 2; done
          curl -fsS localhost:8080/login | grep -q '<div id="root">'
      - if: failure()
        run: docker logs echo-builder || true
