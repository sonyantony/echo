# EY ECHO Builder settings for this install. Copy to application.yaml (same folder) and edit.
# Anything here overrides the defaults built into the image.

echo:
  security:
    # Builder users. Generate a bcrypt hash with e.g.:
    #   htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n' | sed 's/$2y/$2a/'
    users:
      - username: designer
        password: "{bcrypt}$2a$10$CpoTFsLB8DIRLsxvK3yozekVXxg0.BnR9vwzVMUqXpTlmUPvf8/.a"   # "designer"
        roles: [DESIGNER]

  # Publish targets: Publish sends a flow to every enabled one (see docs/publishing.md).
  git:
    # The flow repository the Builder publishes to (any Git server, HTTPS).
    enabled: true
    url: https://git.example.com/acme/echo-flows.git
    branch: main
    username: echo-bot
    token: ${ECHO_GIT_TOKEN:changeme}   # better: set ECHO_GIT_TOKEN in the environment
    committer-name: EY ECHO Builder
    committer-email: echo-builder@example.com

  s3:
    # Also publish to a bucket on Amazon S3 or an S3-compatible store.
    enabled: false
    bucket: acme-echo-flows
    prefix: flows
    region: eu-west-1
    # endpoint: http://minio:9000        # only for S3-compatible stores
    access-key: ${ECHO_S3_ACCESS_KEY:changeme}   # better: set these in the environment
    secret-key: ${ECHO_S3_SECRET_KEY:changeme}

  editor:
    # How often (seconds) the flow editor saves unsaved changes to the draft. 0 turns autosave off.
    autosave-seconds: 10

  branding:
    # Your company logo and colours (see docs/branding.md). Put logo files in config/branding/
    # and refer to them as /branding/<file>. Leave a setting out to keep the default.
    logo: /branding/logo.svg
    logo-alt: Acme
    # favicon: /branding/favicon.svg
    # colors:
    #   primary: "#FFE600"
    #   primary-hover: "#E6CF00"
    #   on-primary: "#2E2E38"
    #   accent-text: "#2E2E38"
    #   masthead-background: "#2E2E38"
    #   masthead-text: "#FFFFFF"
