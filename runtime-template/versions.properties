# Versions every flow image is built with. Keep camel.version in step with
# builder-backend/pom.xml and builder-ui/scripts/copy-camel-catalog.mjs (a test checks this).
camel.version=4.22.1
# Camel JBang asks registry.quarkus.io for this unless it is given; any value works for Spring Boot exports.
quarkus.version=3.36.0
# Swagger UI at <Base Path>/docs of each flow (webjar). Keep in step with builder-backend/pom.xml
# (swagger-ui.version; a test checks this).
swagger-ui.version=5.33.1
jib.version=3.5.2
base.image=eclipse-temurin:21-jre
