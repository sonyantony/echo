# EY ECHO runtime defaults, applied to every flow. A flow's own application.properties
# is appended after these, so a flow can override any of them.
server.port=8080
spring.main.banner-mode=off
camel.main.name=${ECHO_FLOW_NAME:echo-flow}
# The app's name in logs (ECS service.name), metrics (application tag) and traces (service name).
spring.application.name=${ECHO_FLOW_NAME:echo-flow}
# REST DSL always runs on platform-http (the Builder hides the Component setting).
camel.rest.component=platform-http

# Health for container platforms (liveness/readiness probes), and metrics in Prometheus format at
# /actuator/prometheus (docs/observability.md): requests in (http.server.requests), routes and calls
# out (camel.*), JVM and process. Same port as the flows; the Ingress routes only the flows' paths.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Response-time histograms, so dashboards can show percentiles (p95, p99) across pods.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Camel's own OpenTelemetry auto-configuration is off: EY ECHO turns tracing on only when the
# standard OTEL_* settings ask for it (OTEL_EXPORTER_OTLP_ENDPOINT; docs/observability.md).
camel.opentelemetry2.enabled=false

# Structured JSON logs on stdout.
logging.structured.format.console=ecs

# HTTP log of every request and response, in and out (docs/http-log.md). Defaults shown.
