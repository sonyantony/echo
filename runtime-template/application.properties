# ECHO runtime defaults, applied to every flow. A flow's own application.properties
# is appended after these, so a flow can override any of them.
server.port=8080
spring.main.banner-mode=off
camel.main.name=${ECHO_FLOW_NAME:echo-flow}

# Health for container platforms (liveness/readiness probes).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Structured JSON logs on stdout.
logging.structured.format.console=ecs
