spring:
  application:
    name: echo-builder
  datasource:
    url: jdbc:h2:file:${echo.data-dir}/h2/echo;AUTO_SERVER=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

echo:
  # Folder for the Builder's own data: H2 database and the Git working copy.
  data-dir: ./data
  security:
    # Version 1: Builder users live here. Passwords are Spring-encoded (bcrypt).
    # Demo user: designer / designer. Replace before any real use.
    users:
      - username: designer
        password: "{bcrypt}$2a$10$CpoTFsLB8DIRLsxvK3yozekVXxg0.BnR9vwzVMUqXpTlmUPvf8/.a"
        roles: [DESIGNER]
  validation:
    # Version 1 scope: HTTP + JSON, plus the DataMapper's XSLT.
    allowed-components: [platform-http, http, https, xslt-saxon, log, direct]
    allowed-languages: [simple, constant, header, exchangeProperty, variable]

server:
  servlet:
    session:
      timeout: 8h
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
