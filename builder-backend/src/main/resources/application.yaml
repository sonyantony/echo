spring:
  application:
    name: echo-builder
  datasource:
    url: jdbc:h2:file:${echo.data-dir}/h2/echo;AUTO_SERVER=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Flow uploads (zip of a flow folder); FlowArchive also caps the unpacked size.
      max-file-size: 5MB
      max-request-size: 5MB

echo:
  # Folder for the Builder's own data: H2 database and the Git working copy.
  data-dir: ./data
  # Publish targets. Publish sends a flow to every enabled target; Delete removes it from all of
  # them. The Flows page lists published flows from the first enabled one (Git, else S3).
  security:
    # Version 1: Builder users live here. Passwords are Spring-encoded (bcrypt).
    # Demo user: designer / designer. Replace before any real use.
    users:
      - username: designer
        password: "{bcrypt}$2a$10$CpoTFsLB8DIRLsxvK3yozekVXxg0.BnR9vwzVMUqXpTlmUPvf8/.a"
        roles: [DESIGNER]
  git:
    # The flow repository (any Git server). This target is off until url is set.
    enabled: ${ECHO_GIT_ENABLED:true}
    url: ${ECHO_GIT_URL:}
    branch: ${ECHO_GIT_BRANCH:main}
    username: ${ECHO_GIT_USERNAME:}
    token: ${ECHO_GIT_TOKEN:}
    committer-name: EY ECHO Builder
    committer-email: echo-builder@example.com
    # workdir: defaults to <data-dir>/git
  s3:
    # A bucket on Amazon S3 or an S3-compatible store (MinIO, Ceph, ...). Off by default.
    enabled: ${ECHO_S3_ENABLED:false}
    bucket: ${ECHO_S3_BUCKET:}
    prefix: flows                 # flows go to <prefix>/<flow>/<file>
    region: ${ECHO_S3_REGION:us-east-1}
    endpoint: ${ECHO_S3_ENDPOINT:}  # e.g. http://minio:9000; empty means Amazon S3
    access-key: ${ECHO_S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
    secret-key: ${ECHO_S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
    session-token: ${AWS_SESSION_TOKEN:}
  branding:
    # The buyer's company logo and colours. Override any of these in /config/application.yaml;
    # no rebuild needed. The product name "EY ECHO Builder" is fixed.
    # URLs the browser loads. /branding/<file> is served from asset-dir first, then from the
    # defaults built into the image (builder-backend/src/main/resources/branding/).
    logo: /branding/logo.svg
    logo-alt: Company logo
    favicon: /branding/favicon.svg
    asset-dir: ${ECHO_BRANDING_DIR:./config/branding}
    # The look of the whole Builder, the flow editor included. One of:
    #   studio     light, with a dot-grid canvas
    #   graphite   dark throughout
    #   blueprint  light, with a dark grid canvas
    theme: studio
    # CSS colours (EY: yellow #FFE600, grey #2E2E38). Leave one out to keep the PatternFly default.
    colors:
      primary: "#FFE600"            # primary buttons, selected items
      primary-hover: "#E6CF00"
      on-primary: "#2E2E38"         # text on primary buttons
      accent-text: "#2E2E38"        # text drawn in the brand colour (tabs, toggles)
      masthead-background: "#2E2E38"
      masthead-text: "#FFFFFF"
  catalog:
    # Processors the editor's catalog hides: they need jars the Builder does not bundle, so Run
    # could not start a flow that uses them. Kamelets are hidden unless "kamelet" is an allowed component.
    hidden-processors: [circuitBreaker, onFallback, saga, marshal, unmarshal, transacted, policy, script,
                        tokenizer, a2aSubTask, pausable, resumable]
  editor:
    # How often (seconds) the flow editor saves unsaved changes to the draft. 0 turns autosave off.
    autosave-seconds: 10
  run:
    # The editor's Run button: runs a draft inside the Builder so users can send it requests.
    enabled: true
    # Each running flow listens on its own port from this range (publish them in docker-compose).
    first-port: 8081
    last-port: 8090
    # A run with no requests for this many minutes is stopped.
    idle-minutes: 30
    # How users reach the run ports, without the port (shown in the editor).
    public-url: http://localhost
  validation:
    # HTTP + JSON, the DataMapper's XSLT, and rest-openapi (calls an operation of an OpenAPI spec).
    # The editor's catalog shows only these. Adding one also needs its jar in builder-backend/pom.xml,
    # or Run cannot start flows that use it.
    allowed-components: [platform-http, http, https, xslt-saxon, log, direct, rest-openapi]
    allowed-languages: [simple, constant, header, exchangeProperty, variable]

server:
  servlet:
    session:
      timeout: 8h
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
