# EY ECHO Builder for a single install (about 10 users).
#   1. Copy config/application.example.yaml to config/application.yaml and edit users and Git.
#   2. docker compose up -d   ->  http://localhost:8080
services:
  echo-builder:
    build: .
    image: echo-builder:latest
    ports:
      - "8080:8080"
      - "8081-8090:8081-8090"    # flows started with the editor's Run button (echo.run.*)
    environment:
      # Secrets can come from the shell or a .env file next to this file instead of
      # application.yaml. Passed only when set: an empty value would override application.yaml.
      - ECHO_GIT_TOKEN
      - ECHO_S3_ACCESS_KEY
      - ECHO_S3_SECRET_KEY
      - ECHO_JIRA_TOKEN
      - ECHO_AI_KEY
      # The approved downstream APIs, kept in Git with their specs (config/apis/).
      - SPRING_CONFIG_IMPORT=optional:file:/config/apis/approved-apis.yaml
    volumes:
      - echo-data:/data          # H2 database and the Git working copy
      - ./config:/config:ro      # application.yaml with users and the flow repository
    restart: unless-stopped

volumes:
  echo-data:
